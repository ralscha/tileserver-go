version: 2

project_name: tileserver-go

builds:
  - id: tileserver
    main: ./cmd/tileserver
    binary: tileserver
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X main.version={{ .Version }}
        -X main.commit={{ .Commit }}
        -X main.date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: binaries
    ids:
      - tileserver
    formats:
      - tar.gz
    name_template: 'tileserver-go_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - SECURITY.md
      - config.example.json

checksum:
  name_template: checksums.txt

release:
  prerelease: auto

changelog:
  sort: asc
